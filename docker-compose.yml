name: ramiro-portfolio
services:
  app:
    image: ${PORTFOLIO_IMAGE:-ramiro-portfolio:local}
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      TRUST_PROXY: '1'
      DATABASE_PATH: /app/data/portfolio.sqlite
    volumes:
      - portfolio-data:/app/data
    expose:
      - '3000'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging:
      options: { max-size: '10m', max-file: '3' }
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app: { condition: service_healthy }
  cloudflare:
    image: cloudflare/cloudflared:latest
    profiles: [cloudflare]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app: { condition: service_healthy }
  quick-tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [demo]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on:
      app: { condition: service_healthy }
volumes:
  portfolio-data:
  caddy-data:
  caddy-config:
